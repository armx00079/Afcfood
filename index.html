<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFC Fast Food – Order Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#ffeb3b;
  color:#111;
}

/* HEADER */
.header{
  background:#d32f2f;
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

/* BANNER */
.banner{
  margin:14px;
  border-radius:16px;
  overflow:hidden;
}
.banner img{
  width:100%;
  display:block;
}

/* MENU */
.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:14px;
}
.card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}
.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}
.card .info{
  padding:10px;
  text-align:center;
}
.card h3{
  margin:4px 0;
  font-size:16px;
}
.card p{
  margin:4px 0;
  font-weight:bold;
}
.card button{
  margin-top:6px;
  width:100%;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#d32f2f;
  color:#fff;
  font-weight:bold;
}

/* CART */
.cart{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111;
  color:#fff;
  padding:12px;
}
.cart button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#ff9800;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">🍔 AFC FAST FOOD</div>

<div class="banner">
  <img src="https://images.unsplash.com/photo-1606755962773-d324e9a13086">
</div>

<div class="menu" id="menu"></div>

<div class="cart">
  <div id="cartText">🛒 Cart empty</div>
  <button onclick="orderWhatsApp()">Order on WhatsApp</button>
</div>

<script>
const phone = "918905518433";

const items = [
  {name:"AFC Chicken Roll", price:80, img:"https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec"},
  {name:"Chicken Cheese Makhani Roll", price:100, img:"https://images.unsplash.com/photo-1604908554027-69e1a6b02a89"},
  {name:"Chicken Bahubali Roll", price:130, img:"https://images.unsplash.com/photo-1618213837799-25d5552820d1"},
  {name:"AFC Veg Roll", price:80, img:"https://images.unsplash.com/photo-1608032077018-c9f3b6e3b0e4"},
  {name:"AFC Veg Cheese Roll", price:100, img:"https://images.unsplash.com/photo-1601050690597-df0568f70950"},
  {name:"Chicken Sandwich", price:80, img:"https://images.unsplash.com/photo-1617196033257-d9b133cf03c5"}
];

let cart = [];

const menu = document.getElementById("menu");
const cartText = document.getElementById("cartText");

items.forEach((item,i)=>{
  menu.innerHTML += `
    <div class="card">
      <img src="${item.img}">
      <div class="info">
        <h3>${item.name}</h3>
        <p>₹${item.price}</p>
        <button onclick="addToCart(${i})">Add to Cart</button>
      </div>
    </div>
  `;
});

function addToCart(i){
  cart.push(items[i]);
  updateCart();
}

function updateCart(){
  if(cart.length===0){
    cartText.innerText="🛒 Cart empty";
    return;
  }
  let total = cart.reduce((s,i)=>s+i.price,0);
  cartText.innerText = `🛒 Items: ${cart.length} | Total: ₹${total}`;
}

function orderWhatsApp(){
  if(cart.length===0){
    alert("Cart khaali hai bhai 😄");
    return;
  }
  let msg = "Hello AFC Fast Food,%0A%0AMy Order:%0A";
  let total = 0;
  cart.forEach(i=>{
    msg += `- ${i.name} ₹${i.price}%0A`;
    total += i.price;
  });
  msg += `%0A*Total: ₹${total}*%0A%0AAddress: Edhah Road, Stadium ke samne, Jaswantgarh`;
  window.open(`https://wa.me/${phone}?text=${msg}`,"_blank");
}
</script>

</body>
</html>
