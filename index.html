<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFC Fast Food</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#ffe600;
}
.header{
  text-align:center;
  font-size:26px;
  font-weight:bold;
  padding:15px;
}
.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:14px;
}
.card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 14px rgba(0,0,0,.25);
  text-align:center;
}
.card img{
  width:100%;
  height:140px;
  object-fit:cover;
}
.card h3{
  margin:8px 6px 0;
  font-size:16px;
}
.card p{
  margin:4px 0;
  font-weight:bold;
}
.card button{
  width:90%;
  margin:8px auto 12px;
  padding:10px;
  border:none;
  border-radius:12px;
  background:#d32f2f;
  color:#fff;
  font-size:15px;
  font-weight:bold;
}
.cart-bar{
  position:fixed;
  bottom:0;left:0;right:0;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
}
.cart-bar button{
  background:#ff9800;
  border:none;
  border-radius:10px;
  padding:10px 14px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">🍔 AFC FAST FOOD 🍕</div>

<div class="menu" id="menu"></div>

<div class="cart-bar">
  <div id="cartText">🛒 Cart empty</div>
  <button onclick="orderNow()">Order on WhatsApp</button>
</div>

<script>
const phone = "918905518433";

const items = [
 {n:"Chicken Double Cheese Sandwich",p:"₹130",Img:"Chicken-dbl-cheese-sandwich.jpg"},
 {n:"Chicken Sandwich",p:"₹80",Img:"Chicken-sandwich.jpg"},
 {n:"AFC Chicken Roll",p:"₹80",Img:"afc-chiken-roll.jpg"},
 {n:"AFC Crunchy Burger",p:"₹80",Img:"afc-crunchy-burger.jpg"},
 {n:"AFC Special Peri Peri Pizza",p:"₹250",Img:"afc-spe-peri-peri-pizza.jpg"},
 {n:"AFC Veg Roll",p:"₹80",Img:"afc-veg-roll.jpg"},
 {n:"Chicken Strips (3pcs)",p:"₹60",Img:"chicke-strips.jpg"},
 {n:"Chicken Strips (6pcs)",p:"₹100",Img:"chicke-strips.jpg"},
 {n:"Chicken Cheese Makhani Roll",p:"₹100",Img:"chicken-cheese-mkhni-gravy-roll.jpg"},
 {n:"Chicken Kabab (4pcs)",p:"₹100",Img:"chicken-kabab.jpg"},
 {n:"Chicken Pop (10pcs)",p:"₹70",Img:"chicken-pop.jpg"},
 {n:"Chicken Pop (25pcs)",p:"₹100",Img:"chicken-pop.jpg"},
 {n:"Chicken Zombo Burger",p:"₹100",Img:"chicken-zombo-burger.jpg"},
 {n:"Chicken Cheese Zinger Burger",p:"₹80",Img:"chike-cheese-zinger-burger.jpg"},
 {n:"Chicken Hot Dog",p:"₹60",Img:"chike-hotdog.jpg"},
 {n:"Chicken Bahubali Roll",p:"₹130",Img:"chiken-bahubali-roll.jpg"},
 {n:"Chicken Burger",p:"₹80",Img:"chiken-burger.jpg"},
 {n:"Chicken Cheese Gravy Pop (25pcs)",p:"₹180",Img:"chiken-cheese-gravy-pop.jpg"},
 {n:"Chicken Cheese Sandwich",p:"₹100",Img:"chiken-cheese-sandwich.jpg"},
 {n:"Chicken Pizza",p:"₹160",Img:"chiken-pizza-.jpg"},
 {n:"Chicken Tandoori Pizza",p:"₹200",Img:"chiken-tanddori-pizza.jpg"},
 {n:"French Fries (Half)",p:"₹70",Img:"french-fraies.jpg"},
 {n:"French Fries (Full)",p:"₹100",Img:"french-fraies.jpg"},
 {n:"Paneer Cheese Pizza",p:"₹180",Img:"paneer-chees-pizza.jpg"},
 {n:"Student Veg Burger",p:"₹60",Img:"student-veg-burger.jpg"},
 {n:"Super Cheese Veg Burger",p:"₹80",Img:"super-cheese-veg-burger.jpg"},
 {n:"Veg Cheese Roll",p:"₹100",Img:"veg-cheese-roll.jpg"},
 {n:"Veg Pizza",p:"₹150",Img:"veg-pizza.jpg"},
 {n:"Veg Sandwich",p:"₹80 / ₹100 / ₹120",Img:"veg-sandwich.jpg"},
];

let cart=[];

const menu=document.getElementById("menu");
items.forEach(i=>{
  menu.innerHTML+=`
  <div class="card">
    <img src="images/${i.img}">
    <h3>${i.n}</h3>
    <p>${i.p}</p>
    <button onclick="add('${i.n} - ${i.p}')">Add to Cart</button>
  </div>`;
});

function add(item){
  cart.push(item);
  document.getElementById("cartText").innerText =
    "🛒 "+cart.length+" item(s) added";
}

function orderNow(){
  if(cart.length===0) return alert("Cart empty");
  let msg="Hello AFC Fast Food,%0AOrder:%0A"+cart.join("%0A");
  window.open(`https://wa.me/${phone}?text=${msg}`,"_blank");
}
</script>

</body>
</html>
